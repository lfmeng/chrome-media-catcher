<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>翻译功能测试</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .test-section {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      text-align: center;
    }
    h2 {
      color: #667eea;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: monospace;
      resize: vertical;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #5568d3;
    }
    .output {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
      min-height: 100px;
      font-family: monospace;
      white-space: pre-wrap;
    }
    .info {
      background: #e3f2fd;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
    }
    .translation-line {
      background: white;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
    }
    .original-line {
      color: #666;
      font-size: 12px;
      padding-bottom: 6px;
      border-bottom: 1px dashed #ddd;
      margin-bottom: 6px;
    }
    .translated-line {
      color: #333;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>🌐 多行翻译功能测试</h1>

  <div class="test-section">
    <h2>测试1：多行文本分割</h2>
    <div class="info">
      测试文本是否按换行符正确分割成多行
    </div>
    <textarea id="test-input">Hello, world!
This is a test.
Thank you very much.</textarea>
    <button onclick="testSplit()">测试分割</button>
    <div class="output" id="split-output"></div>
  </div>

  <div class="test-section">
    <h2>测试2：HTML渲染</h2>
    <div class="info">
      测试多行翻译结果的HTML渲染效果
    </div>
    <textarea id="html-input">Hello, world!
This is a test.
Thank you very much.
Have a nice day!</textarea>
    <button onclick="testHTML()">测试渲染</button>
    <div class="output" id="html-output"></div>
  </div>

  <div class="test-section">
    <h2>测试3：实际翻译模拟</h2>
    <div class="info">
      模拟翻译API返回结果后的显示效果
    </div>
    <textarea id="translate-input">Hello, world!
This is a test.
Thank you very much.
Have a nice day!</textarea>
    <button onclick="testTranslation()">模拟翻译</button>
    <div class="output" id="translate-output"></div>
  </div>

  <script>
    function testSplit() {
      const input = document.getElementById('test-input').value;
      const lines = input.split('\n').filter(line => line.trim());

      const output = document.getElementById('split-output');
      output.innerHTML = `
✅ 输入文本字符数: ${input.length}
✅ 检测到换行符: ${input.match(/\n/g) ? input.match(/\n/g).length : 0} 个
✅ 分割后的行数: ${lines.length}

📝 分割结果:
${lines.map((line, i) => `  [${i + 1}] "${line}"`).join('\n')}
      `;
    }

    function testHTML() {
      const input = document.getElementById('html-input').value;
      const lines = input.split('\n').filter(line => line.trim());

      let html = '';
      for (let i = 0; i < lines.length; i++) {
        const original = lines[i];
        const translated = `[模拟译文] ${original}`;

        html += '<div class="translation-line">';
        html += '<div class="original-line">' + escapeHtml(original) + '</div>';
        html += '<div class="translated-line">' + escapeHtml(translated) + '</div>';
        html += '</div>';
      }

      const output = document.getElementById('html-output');
      output.innerHTML = html;
    }

    function testTranslation() {
      const input = document.getElementById('translate-input').value;
      const lines = input.split('\n').filter(line => line.trim());

      // 模拟翻译结果
      const mockTranslations = {
        'Hello, world!': '你好，世界！',
        'This is a test.': '这是一个测试。',
        'Thank you very much.': '非常感谢！',
        'Have a nice day!': '祝你度过愉快的一天！'
      };

      let html = '';
      for (let i = 0; i < lines.length; i++) {
        const original = lines[i];
        const translated = mockTranslations[original] || `[未翻译] ${original}`;

        html += '<div class="translation-line">';
        html += '<div class="original-line">' + escapeHtml(original) + '</div>';
        html += '<div class="translated-line">' + escapeHtml(translated) + '</div>';
        html += '</div>';
      }

      const output = document.getElementById('translate-output');
      output.innerHTML = html;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 自动运行测试1
    setTimeout(() => {
      testSplit();
    }, 500);
  </script>
</body>
</html>
